
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apa saja boleh</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neon: '#8b5cf6',
                        cyan: '#22d3ee'
                    },
                    animation: {
                        glow: 'glow 3s ease-in-out infinite',
                        float: 'float 4s ease-in-out infinite',
                    },
                    keyframes: {
                        glow: {
                            '0%, 100%': {
                                boxShadow: '0 0 20px rgba(139,92,246,.2)'
                            },
                            '50%': {
                                boxShadow: '0 0 50px rgba(34,211,238,.3)'
                            }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background:
                radial-gradient(circle at 15% 20%, rgba(124,58,237,.18), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(6,182,212,.15), transparent 35%),
                #070711;
        }

        .grid-bg {
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,.1);
            border-top-color: #a78bfa;
            border-right-color: #22d3ee;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress {
            width: 0%;
            transition: width .1s linear;
        }
    </style>
</head>

<body class="min-h-screen text-white flex items-center justify-center px-4 py-8 grid-bg">

    <!-- Background Effects -->
    <div class="fixed top-0 left-0 w-72 h-72 bg-purple-600/20 blur-[120px] rounded-full pointer-events-none"></div>
    <div class="fixed bottom-0 right-0 w-72 h-72 bg-cyan-500/20 blur-[120px] rounded-full pointer-events-none"></div>

    <!-- Main Card -->
    <main class="relative w-full max-w-md">

        <div class="bg-white/[0.04] border border-white/10 backdrop-blur-2xl rounded-3xl p-7 sm:p-10 shadow-2xl animate-glow">

            <!-- Logo -->
            <div class="flex justify-center mb-8">
                <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-purple-600 to-cyan-500 flex items-center justify-center shadow-lg shadow-purple-500/30 animate-float">

                    <svg xmlns="http://www.w3.org/2000/svg"
                        class="w-10 h-10 text-white"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="1.8">

                        <path stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>

                </div>
            </div>

            <!-- Heading -->
            <div class="text-center mb-8">

                <p class="text-xs tracking-[0.35em] text-cyan-400 font-semibold mb-3">
                    SECURE REDIRECTION
                </p>

                <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-4">
                    <span class="bg-gradient-to-r from-purple-400 via-cyan-300 to-purple-400 bg-clip-text text-transparent">
                        WELCOME
                    </span>
                </h1>

                <p class="text-gray-400 text-sm sm:text-base leading-relaxed">
                    Anda sedang diarahkan menuju halaman tujuan.
                    Mohon tunggu beberapa saat.
                </p>

            </div>

            <!-- Loading Spinner -->
            <div class="flex justify-center mb-7">
                <div class="spinner w-14 h-14 rounded-full"></div>
            </div>

            <!-- Status -->
            <div class="flex items-center justify-center gap-2 mb-5">

                <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>

                <span class="text-xs text-gray-300 tracking-wider">
                    CONNECTION ESTABLISHED
                </span>

            </div>

            <!-- Progress Bar -->
            <div class="w-full h-2 bg-white/10 rounded-full overflow-hidden mb-4">

                <div id="progress"
                    class="progress h-full rounded-full bg-gradient-to-r from-purple-500 to-cyan-400">
                </div>

            </div>

            <!-- Countdown -->
            <div class="text-center">

                <p class="text-sm text-gray-400">
                    Redirect dalam
                    <span id="countdown" class="text-cyan-300 font-bold text-lg">3</span>
                    detik
                </p>

            </div>

            <!-- Manual Button -->
            <a id="manualLink"
                href="https://example.com"
                class="mt-7 block w-full text-center py-3.5 rounded-xl
                bg-gradient-to-r from-purple-600 to-cyan-500
                hover:from-purple-500 hover:to-cyan-400
                transition-all duration-300 font-semibold text-sm
                shadow-lg shadow-purple-500/20 hover:scale-[1.02]">

                CONTINUE NOW →

            </a>

            <!-- Footer -->
            <div class="mt-9 pt-6 border-t border-white/10 text-center">

                <p class="text-[10px] tracking-[0.25em] text-gray-600">
                    Maintenance By @Tauufiik25
                </p>

            </div>

        </div>

    </main>

    <!-- Redirect Script -->
    <script>
        // GANTI URL TUJUAN DI SINI
        const targetURL = "https://example.com";

        // Waktu redirect (detik)
        const redirectTime = 3;

        let remaining = redirectTime;

        const countdown = document.getElementById("countdown");
        const progress = document.getElementById("progress");
        const manualLink = document.getElementById("manualLink");

        manualLink.href = targetURL;

        // Progress dan countdown
        const interval = setInterval(() => {

            remaining--;

            countdown.textContent = remaining;

            const percentage =
                ((redirectTime - remaining) / redirectTime) * 100;

            progress.style.width = percentage + "%";

            if (remaining <= 0) {
                clearInterval(interval);

                window.location.replace(targetURL);
            }

        }, 1000);
    </script>

</body>
</html>
